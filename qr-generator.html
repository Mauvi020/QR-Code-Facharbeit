<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR-Code Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;

      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 30px;

      background: #1e293b;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);

      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    textarea {
      width: 100%;
      min-height: 120px;

      padding: 15px;
      margin-top: 15px;

      border: none;
      border-radius: 10px;

      background: #334155;
      color: white;

      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      box-shadow: 0 0 0 2px #3b82f6;
    }

    button {
      width: 100%;
      padding: 14px;

      margin-top: 15px;

      border: none;
      border-radius: 10px;

      background: #3b82f6;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }

    #qr-container {
      display: flex;
      justify-content: center;
      align-items: center;

      margin-top: 25px;
      padding: 20px;

      background: white;
      border-radius: 15px;

      min-height: 290px;
    }

    #qr-container canvas,
    #qr-container img {
      max-width: 100%;
    }

    #download {
      display: none;
      background: #22c55e;
    }

    #download:hover {
      background: #16a34a;
    }

    .hint {
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🔳 QR-Code Generator</h1>

    <p class="hint">
      Gib einen Text oder eine URL ein.
    </p>

    <textarea
      id="text"
      placeholder="https://example.com"
    ></textarea>

    <button onclick="generateQR()">
      QR-Code erstellen
    </button>

    <div id="qr-container">
      <span class="hint">
        Dein QR-Code erscheint hier.
      </span>
    </div>

    <button id="download" onclick="downloadQR()">
      ⬇️ QR-Code herunterladen
    </button>

  </div>

  <script>
    function generateQR() {

      const text = document.getElementById("text").value.trim();
      const container = document.getElementById("qr-container");
      const downloadButton = document.getElementById("download");

      if (!text) {
        alert("Bitte Text oder eine URL eingeben.");
        return;
      }

      /*
       * QR-Code wird über eine öffentliche API erzeugt.
       */
      const qrUrl =
        "https://api.qrserver.com/v1/create-qr-code/" +
        "?size=500x500" +
        "&data=" +
        encodeURIComponent(text);

      container.innerHTML = "";

      const image = document.createElement("img");

      image.src = qrUrl;
      image.alt = "Generierter QR-Code";
      image.id = "qr-image";

      container.appendChild(image);

      downloadButton.style.display = "block";
    }


    async function downloadQR() {

      const image = document.getElementById("qr-image");

      if (!image) {
        return;
      }

      try {

        const response = await fetch(image.src);
        const blob = await response.blob();

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = url;
        link.download = "qr-code.png";

        document.body.appendChild(link);

        link.click();

        link.remove();

        URL.revokeObjectURL(url);

      } catch (error) {

        /*
         * Falls der Browser den Download blockiert,
         * öffnen wir den QR-Code direkt.
         */
        window.open(image.src, "_blank");
      }
    }
  </script>

</body>
</html>
